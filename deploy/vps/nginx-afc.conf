# /etc/nginx/sites-available/afc  (symlinked into sites-enabled, default site removed)
#
# Front door for both hostnames on the VPS. RECONSTRUCTION: the AWS site config captured by
# aws-gather.sh is the reference; where the two disagree on a location, header or limit, the AWS
# version is what production users have been living with and wins unless it is a known fault.
#
# What is deliberately here that the AWS box may not have had:
#   client_max_body_size 25M on the API host - the 20 MB upload_size.conf in backend/.platform/ is
#     an Elastic Beanstalk file and the AWS box does not run Beanstalk, so it likely never applied
#     (runbook trap 5). OCR screenshots need it.
#   the maintenance page from deploy/maintenance/ wired on BOTH hosts.
#   X-AFC-Host: vps on every response - the public probe that proves which box answered after the
#     DNS flip (gate F3). Cloudflare passes custom headers through.
#   Cloudflare real-IP restoration, so the app's country detection (ipinfo on the request IP) and
#     fail2ban see the player, not Cloudflare's edge.
#
# NO HTTP/2, DELIBERATELY (2026-09-11, found during the rehearsal). The frontend checks
# `response.statusText === "OK"` in 17 places (login form, forgot password, verify code, the
# home page's LatestNews, teams, contact form, three admin screens). Over HTTP/2 the status text
# is always "", so every healthy 200 reads as a failure and the user sees "Oops! An error
# occurred"; login itself fails. AWS serves both hosts over HTTP/1.1, which is why it never bit
# there. Turn http2 on only after those checks are replaced by `response.status === 200`
# (frontend follow-up); contexts/AuthContext.tsx:454 already carries the same warning.
#
# Certificate: one Let's Encrypt cert covering all three names, issued by certbot's Cloudflare DNS
# plugin BEFORE DNS points here (07-nginx-cert.sh), renewed by certbot.timer.

# ---- frontend upstream: ONE line, rewritten by deploy/vps/deploy-frontend.sh ----
# The blue/green swap changes only /etc/nginx/afc-frontend-upstream.conf
# (`upstream afc_frontend { server 127.0.0.1:3000; }` or :3001) and reloads nginx. Keeping the
# port out of this file means a deploy never edits the site config.
include /etc/nginx/afc-frontend-upstream.conf;

# ---- Cloudflare edge ranges (https://www.cloudflare.com/ips-v4 and ips-v6, checked 2026-09-11) ----
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# ---- catch-all: refuse every hostname that is not ours ----
# Carried from the AWS frontend box (AWS abuse case 178652411500891-3): without a default server,
# an HTTPS request for the provider-assigned hostname or the bare IP fell through to the first TLS
# block and was served the whole AFC app, which was reported as brand infringement. nginx 1.24 has
# ssl_reject_handshake, so no snakeoil cert is needed; plain HTTP gets 444 (connection closed).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

# ---- plain HTTP for our names: redirect to HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name africanfreefirecommunity.com www.africanfreefirecommunity.com api.africanfreefirecommunity.com www.api.africanfreefirecommunity.com;
    return 301 https://$host$request_uri;
}

# ---- the website (Next.js container on :3000) ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name africanfreefirecommunity.com www.africanfreefirecommunity.com;

    ssl_certificate     /etc/letsencrypt/live/africanfreefirecommunity.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/africanfreefirecommunity.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-AFC-Host vps always;
    # security headers, as on the AWS frontend box
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    client_max_body_size 25M;

    access_log /var/log/nginx/africanfreefirecommunity.access.log;
    error_log  /var/log/nginx/africanfreefirecommunity.error.log;

    location / {
        proxy_pass http://afc_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;

        # deploy/maintenance: branded page instead of "502 Bad Gateway" while the container restarts
        proxy_intercept_errors on;
        error_page 502 503 504 = @maintenance;
    }

    location @maintenance {
        internal;
        root /var/www/afc-maintenance;
        add_header Retry-After 20 always;
        add_header Cache-Control "no-store" always;
        try_files /maintenance.html =503;
    }
}

# ---- the API (gunicorn on :8000) + uploaded media ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.africanfreefirecommunity.com www.api.africanfreefirecommunity.com;

    ssl_certificate     /etc/letsencrypt/live/africanfreefirecommunity.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/africanfreefirecommunity.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-AFC-Host vps always;
    client_max_body_size 25M;

    access_log /var/log/nginx/api.africanfreefirecommunity.access.log;
    error_log  /var/log/nginx/api.africanfreefirecommunity.error.log;

    # uploads: team logos, banners, OCR screenshots. MEDIA_ROOT = /home/ubuntu/AFC-B/media
    location /media/ {
        alias /home/ubuntu/AFC-B/media/;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-AFC-Host vps always;
    }

    # parity with the AWS config. /home/ubuntu/AFC-B/static does NOT exist on AWS either (no
    # STATIC_ROOT, runbook trap 4), so this 404s exactly as production does today. Fixing the
    # Django admin's styling is a code change, logged as a follow-up, not a migration-day edit.
    location /static/ {
        alias /home/ubuntu/AFC-B/static/;
        autoindex off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_request_buffering off;

        proxy_intercept_errors on;
        error_page 502 503 504 = @maintenance;
    }

    location @maintenance {
        internal;
        root /var/www/afc-maintenance;
        add_header Retry-After 20 always;
        add_header Cache-Control "no-store" always;
        try_files /maintenance.html =503;
    }
}
